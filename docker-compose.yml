services:
  # ── PostgreSQL ──────────────────────────────────────
  db:
    image: postgres:15
    container_name: ballpark_db
    environment:
      POSTGRES_DB: ballpark
      POSTGRES_USER: ballpark
      POSTGRES_PASSWORD: ballpark1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/db/init/02_app_tables.sql:/docker-entrypoint-initdb.d/02_app_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballpark"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ballpark_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ────────────────────────────────
  db-loader:
    build: ./backend
    container_name: ballpark_db_loader
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ballpark
      DB_USER: ballpark
      DB_PASSWORD: ballpark1234
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python db/load_kbo_to_postgres.py
    restart: "no"

  backend:
    build: ./backend
    container_name: ballpark_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ballpark:ballpark1234@db:5432/ballpark
      REDIS_URL: redis://redis:6379
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ballpark
      DB_USER: ballpark
      DB_PASSWORD: ballpark1234
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      JWT_EXPIRE_MINUTES: 1440
      TF_FORCE_GPU_ALLOW_GROWTH: "true"
    depends_on:
      db-loader:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

    #deploy:
      #resources:
        #reservations:
          #devices:
            #- driver: nvidia
              #count: 1
              #capabilities: [gpu]
  # ── Frontend (React) ─────────────────────────────────
  frontend:
    build: ./frontend
    container_name: ballpark_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # ── Crawler ───────────────────────────────────────────
  crawler:
    build: ./backend
    container_name: ballpark_crawler
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ballpark
      DB_USER: ballpark
      DB_PASSWORD: ballpark1234
    depends_on:
      db-loader:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    command: cron -f
    restart: unless-stopped

volumes:
  postgres_data:
